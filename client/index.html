<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
:root {
  --rs-red: #b5252f;
  --rs-red-hi: #e14b55;
  --rs-gold: #c8a66a;
  --rs-bg: rgba(10, 11, 14, .92);
  --rs-panel: rgba(18, 20, 25, .96);
  --rs-text: #f4efe7;
  --rs-muted: #c3bcb0;
  --gap: 10px;
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  color: var(--rs-text);
  pointer-events: none;
}

.stack {
  position: fixed;
  width: min(390px, 34vw);
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  z-index: 2147480000;
}

.stack[data-position^="top_"] { top: 5.5vh; }
.stack[data-position^="center_"] { top: 50%; transform: translateY(-50%); }
.stack[data-position^="bottom_"] { bottom: 6vh; flex-direction: column-reverse; }

.stack[data-position$="_left"] {
  left: 24px;
  align-items: flex-start;
}

.stack[data-position$="_center"] {
  left: 50%;
  transform: translateX(-50%);
  align-items: center;
}

.stack[data-position="center_center"] {
  transform: translate(-50%, -50%);
}

.stack[data-position$="_right"] {
  right: 24px;
  align-items: flex-end;
}

.notification {
  --accent: #7e8798;

  position: relative;
  width: 100%;
  min-height: 72px;
  overflow: hidden;
  padding: 14px 17px 15px 18px;

  background: linear-gradient(105deg, rgba(8, 9, 12, .97), var(--rs-panel));
  border: 1px solid rgba(200, 166, 106, .35);
  border-left: 3px solid var(--accent);

  box-shadow:
    0 12px 38px rgba(0, 0, 0, .42),
    inset 0 0 28px rgba(255, 255, 255, .018);

  opacity: 0;
  transform: translateX(22px) scale(.985);
  animation: rs-in .24s cubic-bezier(.2, .75, .25, 1) forwards;
}

.stack[data-position$="_left"] .notification {
  transform: translateX(-22px) scale(.985);
}

.stack[data-position$="_center"] .notification {
  transform: translateY(-12px) scale(.985);
}

.notification.leaving {
  animation: rs-out .22s ease forwards;
}

.notification::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 42%;
  pointer-events: none;
  background: linear-gradient(
    90deg,
    color-mix(in srgb, var(--accent) 16%, transparent),
    transparent
  );
}

.notification::after {
  content: "";
  position: absolute;
  left: 16px;
  right: 16px;
  top: 0;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(229, 199, 143, .8),
    transparent
  );
}

.row {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 12px;
  align-items: center;
}

.icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;

  display: grid;
  place-items: center;

  border: 1px solid color-mix(in srgb, var(--accent) 72%, white 8%);
  color: var(--accent);

  font-family: Arial, sans-serif;
  font-weight: 800;
  font-size: 18px;

  background: rgba(0, 0, 0, .32);
  box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 24%, transparent);
}

.title {
  margin: 0 0 3px;
  font-size: 14px;
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: 1.25px;
  text-transform: uppercase;
  color: #f1d9a8;
}

.message {
  font-size: 15px;
  line-height: 1.3;
  color: var(--rs-text);
  overflow-wrap: anywhere;
  text-shadow: 0 1px 1px #000;
}

.progress {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 2px;
  width: 100%;
  background: var(--accent);
  transform-origin: left center;
  opacity: .8;
}

.type-info { --accent: #6f9dd3; }
.type-success { --accent: #6cab78; }
.type-warning { --accent: #d4a64b; }
.type-error { --accent: #c94d58; }
.type-neutral { --accent: #a6a6a6; }

@keyframes rs-in {
  to {
    opacity: 1;
    transform: translate(0, 0) scale(1);
  }
}

@keyframes rs-out {
  to {
    opacity: 0;
    transform: translateY(-8px) scale(.97);
    filter: blur(1px);
  }
}

@keyframes rs-progress {
  from { transform: scaleX(1); }
  to { transform: scaleX(0); }
}

@media (max-width: 900px) {
  .stack { width: min(360px, 46vw); }
  .message { font-size: 13px; }
}
</style>
</head>
<body>

<div id="stacks"></div>

<script>
(function () {
  "use strict";

  var MAX_PER_POSITION = 5;
  var REMOVE_MS = 230;

  var timers = new Map();
  var byId = new Map();
  var byDedupe = new Map();

  var positions = [
    "top_left",
    "top_center",
    "top_right",
    "center_left",
    "center_center",
    "center_right",
    "bottom_left",
    "bottom_center",
    "bottom_right"
  ];

  var root = document.getElementById("stacks");

  positions.forEach(function (position) {
    var stack = document.createElement("div");

    stack.className = "stack";
    stack.dataset.position = position;
    stack.id = "stack-" + position;

    root.appendChild(stack);
  });

  function iconFor(type) {
    return {
      info: "i",
      success: "✓",
      warning: "!",
      error: "×",
      neutral: "•"
    }[type] || "i";
  }

  function clearTimer(id) {
    var timer = timers.get(id);

    if (timer) clearTimeout(timer);
    timers.delete(id);
  }

  function removeNow(id) {
    var item = byId.get(id);

    if (!item) return;

    clearTimer(id);
    byId.delete(id);

    if (
      item.dataset.dedupe &&
      byDedupe.get(item.dataset.dedupe) === id
    ) {
      byDedupe.delete(item.dataset.dedupe);
    }

    item.remove();
  }

  function dismiss(id) {
    var item = byId.get(id);

    if (!item || item.classList.contains("leaving")) return;

    clearTimer(id);
    item.classList.add("leaving");

    setTimeout(function () {
      removeNow(id);
    }, REMOVE_MS);
  }

  function schedule(item, payload) {
    clearTimer(payload.id);

    if (!(payload.duration > 0)) return;

    var progress = item.querySelector(".progress");

    if (progress && payload.progress !== false) {
      progress.style.animation =
        "rs-progress " + payload.duration + "ms linear forwards";
    }

    timers.set(
      payload.id,
      setTimeout(function () {
        dismiss(payload.id);
      }, payload.duration)
    );
  }

  function make(payload) {
    var item = document.createElement("div");

    item.className = "notification type-" + payload.type;
    item.dataset.id = payload.id;

    if (payload.dedupeKey) {
      item.dataset.dedupe = payload.dedupeKey;
    }

    var row = document.createElement("div");
    row.className = "row";

    var icon = document.createElement("div");
    icon.className = "icon";
    icon.textContent = payload.icon || iconFor(payload.type);

    var copy = document.createElement("div");

    if (payload.title) {
      var title = document.createElement("div");

      title.className = "title";
      title.textContent = payload.title;

      copy.appendChild(title);
    }

    var message = document.createElement("div");

    message.className = "message";
    message.textContent = payload.message;

    copy.appendChild(message);

    row.appendChild(icon);
    row.appendChild(copy);

    item.appendChild(row);

    if (payload.duration > 0 && payload.progress !== false) {
      var progress = document.createElement("div");

      progress.className = "progress";
      item.appendChild(progress);
    }

    return item;
  }

  function show(payload) {
    if (!payload || !payload.id || !payload.message) return;

    if (payload.dedupeKey) {
      var oldId = byDedupe.get(payload.dedupeKey);

      if (oldId && oldId !== payload.id) {
        removeNow(oldId);
      }
    }

    if (byId.has(payload.id)) {
      removeNow(payload.id);
    }

    var stack =
      document.getElementById("stack-" + payload.position) ||
      document.getElementById("stack-top_right");

    var item = make(payload);

    stack.appendChild(item);
    byId.set(payload.id, item);

    if (payload.dedupeKey) {
      byDedupe.set(payload.dedupeKey, payload.id);
    }

    schedule(item, payload);

    while (stack.children.length > MAX_PER_POSITION) {
      var victim = stack.firstElementChild;

      if (!victim) break;
      removeNow(victim.dataset.id);
    }
  }

  function clearAll() {
    Array.from(byId.keys()).forEach(removeNow);
  }

  window.addEventListener("notify:show", function (event) {
    show(event.detail || {});
  });

  window.addEventListener("notify:clear", function (event) {
    var payload = event.detail || {};
    if (payload.id) dismiss(String(payload.id));
  });

  window.addEventListener("notify:clearAll", function () {
    clearAll();
  });

  try {
    callEvent("ready", JSON.stringify({}));
  } catch (_) {}
})();
</script>

</body>
</html>
