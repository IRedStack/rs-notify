<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
* { box-sizing: border-box; }

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  overflow: hidden;
  background: transparent !important;
}

body {
  font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  pointer-events: none;
}

.notifications {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.notification {
  position: absolute;
  color: #fff;
  text-align: center;
  padding: 1.5rem;
  background: rgba(0, 0, 0, .5);
  opacity: 0;
  animation: rsFadeIn .55s ease forwards;
  text-shadow: 0 2px 3px rgba(0, 0, 0, .75);
}

.notification.leaving {
  animation: rsFadeOut 2s ease forwards;
}

.notification .title {
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 40px;
  line-height: 1.05;
}

.notification .text {
  margin-top: .35rem;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 1.1vw;
  line-height: 1.35;
}

.rs {
  background:
    linear-gradient(217deg, rgba(0, 0, 0, .8), rgba(255, 0, 0, 0) 70.71%),
    linear-gradient(127deg, rgba(0, 0, 0, .8), rgba(0, 255, 0, 0) 70.71%),
    linear-gradient(336deg, rgba(0, 0, 0, .8), rgba(0, 0, 255, 0) 70.71%);
  letter-spacing: 2px;
}

.rs_min {
  background: transparent;
  letter-spacing: 2px;
}

.rs_3d {
  background: transparent;
  transform: perspective(500px) rotateY(15deg);
}

.rs_kill,
.rs_prompt {
  background: transparent;
}

.rs_kill .text::before {
  content: "☠";
  display: inline-block;
  margin-right: 10px;
  font-size: 30px;
  vertical-align: middle;
  animation: rotating 2s linear infinite;
}

.rs_prompt .text::before {
  content: "?";
  display: inline-grid;
  place-items: center;
  width: 30px;
  height: 30px;
  margin-right: 10px;
  border: 2px solid currentColor;
  border-radius: 50%;
  font-weight: 700;
  vertical-align: middle;
  animation: promptBounce .8s ease both;
}

.top_large {
  top: 8%;
  width: 100%;
  left: 0;
}

.top_left {
  left: 20px;
  top: 8%;
}

.top_right {
  right: 20px;
  top: 8%;
}

.top_center {
  left: 50%;
  top: 8%;
  transform: translate(-50%, -50%);
}

.center_large {
  width: 100%;
  bottom: 50%;
  left: 0;
}

.center_right {
  right: 20px;
  bottom: 50%;
}

.center_left {
  left: 20px;
  bottom: 50%;
}

.center_center {
  left: 50%;
  bottom: 50%;
  transform: translate(-50%, -50%);
}

.bottom_large {
  width: 100%;
  bottom: 8%;
  left: 0;
}

.bottom_right {
  right: 20px;
  bottom: 8%;
}

.bottom_left {
  left: 20px;
  bottom: 8%;
}

.bottom_center {
  left: 50%;
  bottom: 8%;
  transform: translate(-50%, -50%);
  z-index: 950000;
}

@keyframes rsFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes rsFadeOut {
  from { opacity: 1; }
  to { opacity: 0; }
}

@keyframes rotating {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes promptBounce {
  0% { transform: translateY(-14px); opacity: 0; }
  65% { transform: translateY(3px); opacity: 1; }
  100% { transform: translateY(0); opacity: 1; }
}

@media (max-width: 1100px) {
  .notification .title { font-size: 34px; }
  .notification .text { font-size: 16px; }
}
</style>
</head>
<body>
<div class="notifications"></div>

<script>
(function () {
  "use strict";

  var root = document.querySelector(".notifications");
  var active = null;
  var dismissTimer = null;
  var removeTimer = null;

  function cancelTimers() {
    if (dismissTimer) clearTimeout(dismissTimer);
    if (removeTimer) clearTimeout(removeTimer);
    dismissTimer = null;
    removeTimer = null;
  }

  function clearNow() {
    cancelTimers();
    if (active) active.remove();
    active = null;
    root.textContent = "";
  }

  function setLimitedRichText(node, value) {
    var source = String(value || "");
    var safe = source
      .replace(/<(?!\/?(?:b|strong|i|em|br)\b)[^>]*>/gi, "")
      .replace(/<(b|strong|i|em)\b[^>]*>/gi, "<$1>")
      .replace(/<\/(b|strong|i|em)>/gi, "</$1>")
      .replace(/<br\s*\/?>/gi, "<br>");

    node.innerHTML = safe;
  }

  function show(payload) {
    if (!payload) return;

    clearNow();

    var notification = document.createElement("div");
    notification.className =
      "notification " +
      (payload.position || "bottom_large") +
      " " +
      (payload.design || "rs_min");

    notification.dataset.id = String(payload.id || "");

    if (payload.title) {
      var title = document.createElement("div");
      title.className = "title";
      title.textContent = String(payload.title);
      notification.appendChild(title);
    }

    if (payload.text) {
      var text = document.createElement("div");
      text.className = "text";

      if (payload.richText) setLimitedRichText(text, payload.text);
      else text.textContent = String(payload.text);

      notification.appendChild(text);
    }

    root.appendChild(notification);
    active = notification;

    var duration = Number(payload.duration);

    if (Number.isFinite(duration) && duration > 0) {
      dismissTimer = setTimeout(function () {
        if (!active || active !== notification) return;
        notification.classList.add("leaving");

        removeTimer = setTimeout(function () {
          if (active === notification) clearNow();
        }, 2000);
      }, duration);
    }
  }

  window.addEventListener("notify:show", function (event) {
    show(event.detail || {});
  });

  window.addEventListener("notify:clear", clearNow);
  window.addEventListener("notify:clearAll", clearNow);

  try {
    callEvent("ready", JSON.stringify({}));
  } catch (_) {}
})();
</script>
</body>
</html>
